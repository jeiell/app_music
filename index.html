<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050608">
    <link rel="manifest" href="manifest.json">
    <title>Cyber Audio Glass</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-900: #050608;
            --bg-850: #0c1016;
            --surface: rgba(255, 255, 255, 0.06);
            --surface-strong: rgba(255, 255, 255, 0.12);
            --text-primary: #f8f8f9;
            --text-muted: #a0a8b8;
            --accent: #ff000f;
            --accent-soft: rgba(255, 0, 15, 0.24);
            --accent-strong: #ff2542;
            --shadow: 0 32px 90px rgba(0, 0, 0, 0.36);
            --transition: 0.24s ease;
        }

        body.light {
            --bg-900: #ffffff;
            --bg-850: #ffffff;
            --surface: rgba(255, 255, 255, 0.95);
            --surface-strong: rgba(255, 255, 255, 1);
            --text-primary: #111827;
            --text-muted: #6b7280;
            --accent: #d7263d;
            --accent-soft: rgba(215, 38, 61, 0.15);
            --accent-strong: #ff4d5a;
            --shadow: 0 32px 70px rgba(0, 0, 0, 0.12);
        }

        html {
            min-height: 100%;
            overflow-x: hidden;
        }

        body {
            min-height: 100vh;
            height: auto;
            overflow-x: hidden;
            overflow-y: auto;
            font-family: 'Inter', sans-serif;
            color: var(--text-primary);
            background: radial-gradient(circle at top, rgba(255, 59, 79, 0.12), transparent 18%),
                        linear-gradient(180deg, var(--bg-900), var(--bg-850) 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: env(safe-area-inset-top, 0.9rem) env(safe-area-inset-right, 0.9rem) env(safe-area-inset-bottom, 0.9rem) env(safe-area-inset-left, 0.9rem);
            transition: background var(--transition), color var(--transition);
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 85% 20%, rgba(255, 0, 15, 0.20), transparent 12%),
                        radial-gradient(circle at 20% 90%, rgba(255, 255, 255, 0.06), transparent 18%);
            pointer-events: none;
            z-index: 0;
        }

        .app-shell {
            position: relative;
            width: min(520px, 100%);
            max-width: 520px;
            display: grid;
            gap: 1rem;
            text-align: center;
            z-index: 1;
            margin: 0 auto;
        }

        .app-shell::before {
            content: '';
            position: absolute;
            inset: -1rem;
            border-radius: 42px;
            background: linear-gradient(180deg, rgba(255, 0, 15, 0.25), rgba(255, 255, 255, 0.03));
            filter: blur(24px);
            opacity: 0.65;
            z-index: -1;
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        .app-title {
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 10px;
            text-transform: uppercase;
            color: var(--accent);
            text-shadow: 0 0 24px rgba(255, 59, 79, 0.18);
        }

        .icon-button {
            border: 1px solid rgba(255, 255, 255, 0.14);
            background: rgba(255, 59, 79, 0.12);
            color: var(--text-primary);
            border-radius: 14px;
            padding: 0.9rem 1rem;
            cursor: pointer;
            font-size: 0.95rem;
            transition: background var(--transition), transform var(--transition), box-shadow var(--transition);
        }

        .icon-button:hover {
            transform: translateY(-1px);
            background: rgba(255, 59, 79, 0.18);
        }

        .card {
            position: relative;
            border-radius: 32px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(24px);
            box-shadow: var(--shadow);
            padding: 1.3rem 1rem 0.9rem;
            overflow: hidden;
            transition: background var(--transition), border-color var(--transition), box-shadow var(--transition);
        }

        .card::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.12), transparent 58%);
            pointer-events: none;
        }

        .menu-container {
            position: relative;
            width: min(280px, 100%);
            aspect-ratio: 1 / 1;
            margin: 0 auto 0.65rem;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(24px);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 32px 70px rgba(0, 0, 0, 0.30);
            min-height: 260px;
        }

        .menu-item {
            position: absolute;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-muted);
            font-size: 0.95rem;
            border: 1px solid transparent;
            display: grid;
            place-items: center;
            cursor: pointer;
            transition: transform var(--transition), background var(--transition), color var(--transition), border-color var(--transition), box-shadow var(--transition);
        }

        .menu-item:hover,
        .menu-item:focus-visible {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.18);
            outline: none;
        }

        .menu-item.active {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.24);
            border-color: rgba(255, 0, 15, 0.75);
            box-shadow: 0 18px 30px rgba(255, 0, 15, 0.22);
        }

        .menu-item.highlighted {
            color: #ff162b;
            text-shadow: 0 0 16px rgba(255, 22, 43, 0.85);
        }

        .menu-item:nth-child(1) { top: 8px; left: calc(50% - 19px); }
        .menu-item:nth-child(2) { top: 52px; right: 14px; }
        .menu-item:nth-child(3) { top: 122px; right: 14px; }
        .menu-item:nth-child(4) { bottom: 8px; left: calc(50% - 19px); }
        .menu-item:nth-child(5) { bottom: 52px; left: 14px; }
        .menu-item:nth-child(6) { top: 52px; left: 14px; }

        .central-dimmer {
            position: relative;
            width: 122px;
            height: 122px;
            border-radius: 50%;
            background: rgba(18, 12, 16, 0.34);
            border: 1px solid rgba(255, 0, 15, 0.25);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 18px 30px rgba(255, 0, 15, 0.18);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform var(--transition);
        }

        .central-dimmer:hover {
            transform: translateY(-2px);
        }

        .dimmer-inner {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: rgba(18, 14, 20, 0.92);
            border: 1px solid rgba(255, 0, 15, 0.18);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .center-play-btn {
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* REGRAS ADICIONADAS PARA RESPONSIVIDADE NO CELULAR */
        @media (max-width: 480px) {
            body {
                padding: 0.5rem;
            }

            .app-shell {
                gap: 0.6rem;
            }

            .card {
                padding: 1rem 0.8rem 0.8rem;
                border-radius: 24px;
            }

            .menu-container {
                width: 250px;
                min-height: 250px;
            }

            .menu-item {
                width: 36px;
                height: 36px;
                font-size: 0.85rem;
            }
            .menu-item:nth-child(1) { top: 6px; left: calc(50% - 18px); }
            .menu-item:nth-child(2) { top: 48px; right: 10px; }
            .menu-item:nth-child(3) { top: 114px; right: 10px; }
            .menu-item:nth-child(4) { bottom: 6px; left: calc(50% - 18px); }
            .menu-item:nth-child(5) { bottom: 48px; left: 10px; }
            .menu-item:nth-child(6) { top: 48px; left: 10px; }

            .central-dimmer {
                width: 106px;
                height: 106px;
            }

            .dimmer-inner {
                width: 86px;
                height: 86px;
            }
        }
    </style>
</head>
<body>

    <!-- A estrutura do seu HTML (app-shell, cards, etc) continua aqui em baixo -->

</body>
</html>
