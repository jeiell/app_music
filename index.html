<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#050608">
    <title>Cyber Audio Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        /* Resets Básicos */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        :root {
            --bg-gradient: linear-gradient(180deg, #160608 0%, #050203 100%);
            --surface: rgba(35, 30, 31, 0.85);
            --surface-border: rgba(255, 255, 255, 0.04);
            --text-primary: #ffffff;
            --text-muted: #a0a0a0;
            --accent: #ff1e3a;
            --accent-glow: rgba(255, 30, 58, 0.25);
            --transition: 0.2s ease;
        }

        body.light {
            --bg-gradient: linear-gradient(180deg, #f3f4f6 0%, #e5e7eb 100%);
            --surface: rgba(255, 255, 255, 0.9);
            --surface-border: rgba(0, 0, 0, 0.08);
            --text-primary: #111827;
            --text-muted: #6b7280;
            --accent: #d7263d;
            --accent-glow: rgba(215, 38, 61, 0.15);
        }

        /* Força o aplicativo a caber na área visível exata do celular */
        body {
            font-family: 'Inter', sans-serif;
            color: var(--text-primary);
            background: var(--bg-gradient);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background var(--transition), color var(--transition);
            
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            overflow: hidden;
            padding: 12px;
        }

        .app-shell {
            width: 100%;
            max-width: 430px;
            height: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Cabeçalho */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 35px;
            flex-shrink: 0;
        }

        .app-title {
            font-size: 0.9rem;
            font-weight: 900;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: var(--accent);
            text-shadow: 0 0 15px var(--accent-glow);
        }

        .theme-btn {
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-primary);
            border-radius: 10px;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            backdrop-filter: blur(5px);
        }

        /* Painel Central Neumórfico/Glassmorphic */
        .card {
            flex: 1;
            min-height: 0; /* Permite encolhimento no flexbox */
            border-radius: 28px;
            background: var(--surface);
            border: 1px solid var(--surface-border);
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.05), 0 15px 35px rgba(0,0,0,0.5);
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 10px;
            overflow: hidden;
        }

        /* Seção do Disco de Controle */
        .menu-section {
            flex: 1;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .menu-container {
            position: relative;
            width: 195px;
            height: 195px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 100%), rgba(255, 255, 255, 0.01);
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3), inset 0 2px 5px rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .menu-item {
            position: absolute;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: var(--text-muted);
            font-size: 0.85rem;
            display: grid;
            place-items: center;
            cursor: pointer;
            transition: all var(--transition);
        }

        .menu-item.highlighted {
            color: #ffffff;
            background: #ff8c00;
            border-color: #ffaa33;
            box-shadow: 0 0 12px rgba(255, 140, 0, 0.4);
        }

        /* Posições da roda ajustadas para o tamanho de 195px */
        .menu-item:nth-child(1) { top: 6px; left: calc(50% - 17px); }
        .menu-item:nth-child(2) { top: 36px; right: 10px; }
        .menu-item:nth-child(3) { bottom: 36px; right: 10px; }
        .menu-item:nth-child(4) { bottom: 6px; left: calc(50% - 17px); }
        .menu-item:nth-child(5) { bottom: 36px; left: 10px; }
        .menu-item:nth-child(6) { top: 36px; left: 10px; }

        .central-dimmer {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            background: #141112;
            border: 2px solid rgba(255, 30, 58, 0.12);
            box-shadow: inset 0 3px 8px rgba(0,0,0,0.8), 0 0 15px var(--accent-glow);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .center-play-btn {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 10px;
            background: #ff8c00;
            color: #ffffff;
            cursor: pointer;
            display: grid;
            place-items: center;
            box-shadow: 0 4px 12px rgba(255, 140, 0, 0.4);
        }

        .center-play-btn .play-icon {
            display: block;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 6px 0 6px 11px;
            border-color: transparent transparent transparent #ffffff;
            transform: translateX(1px);
        }

        .center-play-btn.playing .play-icon {
            border: none;
            width: 11px;
            height: 12px;
            background: #ffffff;
            box-shadow: -4px 0 0 #ffffff, 4px 0 0 #ffffff;
            transform: scaleX(0.5);
        }

        /* Painel Inferior de Exibição */
        .display-panel {
            flex: 1.2;
            min-height: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 8px;
        }

        .panel-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-title {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent);
        }

        .volume-group {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1;
            max-width: 140px;
        }

        .volume-group label {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .volume-range {
            width: 100%;
            appearance: none;
            -webkit-appearance: none;
            height: 4px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.08);
            outline: none;
        }

        .volume-range::-webkit-slider-runnable-track {
            height: 4px;
            border-radius: 999px;
        }

        .volume-range::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 12px;
            width: 12px;
            border-radius: 50%;
            background: #0076ff;
            margin-top: -4px;
            box-shadow: 0 0 6px rgba(0, 118, 255, 0.5);
        }

        /* Infos da Música */
        .track-meta {
            display: grid;
            gap: 2px;
        }

        .track-info {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .artist-info {
            font-size: 0.8rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .meta-row {
            display: flex;
            gap: 8px;
            color: var(--text-muted);
            font-size: 0.75rem;
            align-items: center;
        }

        .meta-row span:not(:first-child)::before {
            content: '•';
            color: var(--accent);
            margin-right: 8px;
        }

        /* Botão de Adicionar Arquivo */
        .file-button {
            width: 100%;
            padding: 10px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(0, 0, 0, 0.15);
            color: var(--text-primary);
            font-size: 0.8rem;
            font-weight: 600;
            text-align: center;
            display: block;
            cursor: pointer;
            transition: var(--transition);
        }

        .file-button:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        /* Espaço do Gráfico de Áudio */
        .spectrum-canvas {
            width: 100%;
            height: 36px;
            border-radius: 10px;
            background: rgba(10, 5, 6, 0.5);
            border: 1px solid rgba(255, 0, 15, 0.05);
            display: block;
        }

        /* EQUALIZADOR FIXO NO RODAPÉ SEM SAIR DA TELA */
        .equalizer-panel {
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 6px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            flex-shrink: 0; /* Impede o equalizador de sumir */
        }

        .equalizer-header {
            font-size: 0.7rem;
            font-weight: 900;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 2px;
        }

        .equalizer-controls {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .eq-slider {
            display: flex;
            flex-direction: column;
            gap: 1px;
        }

        .eq-slider .eq-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
        }

        .eq-slider span {
            font-weight: 600;
        }

        .eq-slider output {
            color: var(--text-muted);
        }

        .eq-slider input[type=range] {
            width: 100%;
            appearance: none;
            -webkit-appearance: none;
            height: 3px;
            background: rgba(255,255,255,0.08);
            border-radius: 2px;
            outline: none;
        }

        .eq-slider input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 10px;
            width: 100%;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 5px var(--accent-glow);
        }

        /* Ajuste fino para celulares muito pequenos antigos */
        @media (max-height: 580px) {
            .menu-container { width: 160px; height: 160px; }
            .menu-item { width: 28px; height: 28px; font-size: 0.75rem; }
            .central-dimmer { width: 70px; height: 70px; }
            .center-play-btn { width: 32px; height: 32px; }
            .spectrum-canvas { height: 25px; }
        }
    </style>
</head>
<body>

    <div class="app-shell">
        <header class="app-header">
            <div class="app-title">Cyber Audio Pro</div>
            <button id="themeBtn" class="theme-btn" type="button">Tema claro</button>
        </header>

        <main class="card">
            <section class="menu-section">
                <div class="menu-container">
                    <button class="menu-item" data-action="playlist" title="Playlist">🎵</button>
                    <button class="menu-item" data-action="search" title="Buscar">🔍</button>
                    <button class="menu-item" data-action="next" title="Próxima">⏭</button>
                    <button class="menu-item highlighted" data-action="repeat" title="Repetir">🔁</button>
                    <button class="menu-item highlighted" data-action="shuffle" title="Aleatório">🔀</button>
                    <button class="menu-item" data-action="back" title="Voltar">⏮</button>
                    <div class="central-dimmer">
                        <button class="center-play-btn" id="playBtn" type="button"><span class="play-icon"></span></button>
                    </div>
                </div>
            </section>

            <div class="display-panel">
                <div class="panel-row">
                    <div class="panel-title">Agora tocando</div>
                    <div class="volume-group">
                        <label for="volumeRange">Volume</label>
                        <input id="volumeRange" class="volume-range" type="range" min="0" max="100" value="75">
                    </div>
                </div>

                <div class="track-meta">
                    <div class="track-info" id="trackName">Nenhuma música carregada</div>
                    <div class="artist-info" id="artistName">Adicione faixas de som no botão abaixo</div>
                </div>

                <div class="meta-row">
                    <span>Sem álbum</span>
                    <span>00:00</span>
                    <span>00:00</span>
                </div>

                <div>
                    <label for="trackFiles" class="file-button">Adicionar músicas da pasta</label>
                    <input id="trackFiles" type="file" accept="audio/*" multiple hidden>
                </div>

                <canvas id="spectrumCanvas" class="spectrum-canvas"></canvas>
                
                <div class="equalizer-panel">
                    <div class="equalizer-header">Equalizador Avançado</div>
                    <div class="equalizer-controls" id="eqControls"></div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const playlist = [];
        const playBtn = document.getElementById('playBtn');
        const themeBtn = document.getElementById('themeBtn');
        const trackName = document.getElementById('trackName');
        const artistName = document.getElementById('artistName');
        const trackFiles = document.getElementById('trackFiles');
        const volumeRange = document.getElementById('volumeRange');
        const spectrumCanvas = document.getElementById('spectrumCanvas');
        const eqControls = document.getElementById('eqControls');

        const equalizerBands = [
            { label: 'Graves (120Hz)', gain: 0, min: -12, max: 12 }
        ];

        let isPlaying = false, isLightTheme = false;

        function togglePlay() {
            isPlaying = !isPlaying;
            playBtn.classList.toggle('playing', isPlaying);
        }

        function buildEqualizer() {
            eqControls.innerHTML = equalizerBands.map((band, idx) => `
                <div class="eq-slider">
                    <div class="eq-meta">
                        <span>${band.label}</span>
                        <output id="eqOut-${idx}">${band.gain} dB</output>
                    </div>
                    <input type="range" min="${band.min}" max="${band.max}" value="${band.gain}" data-idx="${idx}">
                </div>
            `).join('');

            eqControls.querySelectorAll('input[type=range]').forEach(input => {
                input.addEventListener('input', (e) => {
                    const idx = e.target.dataset.idx;
                    const val = e.target.value;
                    document.getElementById(`eqOut-${idx}`).textContent = `${val} dB`;
                });
            });
        }

        playBtn.addEventListener('click', togglePlay);
        themeBtn.addEventListener('click', () => {
            isLightTheme = !isLightTheme;
            document.body.classList.toggle('light', isLightTheme);
            themeBtn.textContent = isLightTheme ? 'Tema escuro' : 'Tema claro';
        });

        // Simulação básica do Canvas estável
        function drawEmptySpectrum() {
            const ctx = spectrumCanvas.getContext('2d');
            ctx.clearRect(0, 0, spectrumCanvas.width, spectrumCanvas.height);
            ctx.fillStyle = 'rgba(255, 30, 58, 0.05)';
            ctx.fillRect(0, 0, spectrumCanvas.width, spectrumCanvas.height);
        }

        buildEqualizer();
        drawEmptySpectrum();
    </script>
</body>
</html>
