<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Cyber Audio Pro</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(180deg, #1a080a 0%, #0d0d11 100%);
            --glass-bg: rgba(35, 30, 32, 0.75);
            --glass-border: rgba(255, 255, 255, 0.04);
            --text-main: #df3850;
            --text-dark: #ffffff;
            --text-muted: #a09fa4;
            --slider-track: rgba(255, 255, 255, 0.1);
            --knob-bg: #15161a;
            --canvas-bg: #221316;
            --btn-active: #e67e22;
        }

        .light-theme {
            --bg-gradient: linear-gradient(135deg, #ffeef2 0%, #e5effa 100%);
            --glass-bg: rgba(255, 255, 255, 0.5);
            --glass-border: rgba(255, 255, 255, 0.6);
            --text-main: #df3850;
            --text-dark: #2c3e50;
            --text-muted: #7f8c8d;
            --slider-track: rgba(0, 0, 0, 0.08);
            --knob-bg: #3a3f44;
            --canvas-bg: #3d3436;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-gradient);
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;
            transition: background 0.3s;
            overflow: hidden;
        }

        .window-container {
            background: var(--glass-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            padding: 16px 20px 12px 20px;
            display: grid;
            grid-template-rows: auto 1fr auto auto auto;
            gap: 12px;
            overflow: hidden;
        }

        /* Cabeçalho */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-title {
            color: var(--text-main);
            font-size: 14px;
            font-weight: 900;
            letter-spacing: 4px;
        }

        .theme-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 5px 12px;
            border-radius: 10px;
            font-size: 11px;
            color: var(--text-dark);
            cursor: pointer;
            font-weight: 600;
        }

        /* Área do Player */
        .player-circle-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 140px;
            overflow: hidden;
        }

        .player-circle {
            width: min(205px, 27vh);
            height: min(205px, 27vh);
            background: rgba(255, 255, 255, 0.015);
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.04);
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.3);
        }

        /* Ícones Orbitais */
        .nav-icon {
            --radius: calc(min(205px, 27vh) * 0.39); 
            position: absolute;
            top: calc(50% + (var(--radius) * sin(var(--angle))));
            left: calc(50% + (var(--radius) * cos(var(--angle))));
            width: 32px;
            height: 32px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.2s;
            fill: var(--text-muted);
            z-index: 10;
        }

        /* Ângulos das Órbitas */
        .ic-music        { --angle: -90deg; } 
        .ic-search       { --angle: -30deg; }                         
        .ic-next         { --angle: 30deg; }                          
        .ic-repeat       { --angle: 90deg; }                          
        .ic-shuffle      { --angle: 150deg; }                         
        .ic-prev         { --angle: 210deg; }                         

        /* Linha Dinâmica Vermelha (Botão selecionado) */
        .nav-icon.active-red {
            fill: var(--text-main);
            filter: drop-shadow(0 0 4px var(--text-main));
        }

        /* Toggle Amarelo/Laranja para os Modos de Reprodução */
        .nav-icon.active-orange {
            fill: var(--btn-active);
            background: rgba(230, 126, 34, 0.15);
            border-radius: 50%;
        }

        /* Knob Centralizado */
        .center-knob {
            width: calc(min(205px, 27vh) * 0.42);
            height: calc(min(205px, 27vh) * 0.42);
            background: var(--knob-bg);
            border-radius: 50%;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            z-index: 5;
        }

        .center-knob::before {
            content: '';
            position: absolute;
            top: 5px;
            width: 2px;
            height: 8px;
            background: var(--text-main);
            border-radius: 1px;
        }

        .pause-btn-orange {
            width: 26px;
            height: 30px;
            background: #f39c12;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 4px;
            box-shadow: 0 4px 12px rgba(243, 156, 18, 0.3);
        }

        .pause-btn-orange::before, .pause-btn-orange::after {
            content: '';
            width: 4px;
            height: 14px;
            background: #15161a;
            border-radius: 1.5px;
        }

        /* Painel de Informações */
        .info-card-panel {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 24px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .search-volume-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            font-weight: 800;
        }

        .buscar-musica {
            color: var(--text-main);
            letter-spacing: 1px;
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            width: 60%;
        }

        .track-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .track-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-dark);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-type, .track-meta {
            font-size: 12px;
            color: var(--text-muted);
        }

        .track-meta {
            display: flex;
            gap: 10px;
        }

        .track-meta span:not(:first-child)::before {
            content: '• ';
            color: var(--text-main);
            margin-right: 4px;
        }

        .add-music-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: var(--text-dark);
            padding: 10px;
            border-radius: 14px;
            font-size: 13px;
            text-align: center;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
        }

        .add-music-btn:active {
            background: rgba(255, 255, 255, 0.1);
        }

        /* Espectro de Áudio */
        .canvas-container {
            background: var(--canvas-bg);
            border-radius: 16px;
            height: 50px;
            overflow: hidden;
            width: 100%;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Equalizador */
        .eq-section {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 24px;
            padding: 14px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .eq-title {
            color: var(--text-main);
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .eq-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .eq-slider {
            display: flex;
            flex-direction: column;
        }

        .eq-meta {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            font-weight: 700;
        }

        .eq-label { color: var(--text-dark); }
        .eq-value { color: var(--text-muted); }

        input[type=range] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 2px;
            background: var(--slider-track);
            outline: none;
            margin: 5px 0;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            background: var(--text-main);
            border-radius: 50%;
            cursor: pointer;
        }

        .volume-control input[type=range]::-webkit-slider-thumb {
            background: #007aff;
        }

        .footer-credits {
            text-align: center;
            font-size: 10px;
            color: var(--text-muted);
            font-weight: 500;
            padding: 4px 0 2px 0;
            align-self: end;
        }
    </style>
</head>
<body>

    <div class="window-container">
        <div class="header">
            <div class="brand-title">CYBER AUDIO PRO</div>
            <button id="themeBtn" class="theme-btn">Tema claro</button>
        </div>

        <div class="player-circle-wrapper">
            <div class="player-circle">
                <div class="nav-icon ic-music active-red" data-button="music">
                    <svg viewBox="0 0 24 24" width="14" height="14"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
                </div>
                <div class="nav-icon ic-search" data-button="search">
                    <svg viewBox="0 0 24 24" width="14" height="14"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                </div>
                <div class="nav-icon ic-next" data-button="next">
                    <svg viewBox="0 0 24 24" width="14" height="14"><path d="M6 18l8.5-6L6 6v12zm9-12v12h2V6h-2z"/></svg>
                </div>
                <div class="nav-icon ic-repeat active-orange" data-button="repeat">
                    <svg viewBox="0 0 24 24" width="14" height="14"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l4 4 4-4v3h2v-6h-2v4z"/></svg>
                </div>
                <div class="nav-icon ic-shuffle active-orange" data-button="shuffle">
                    <svg viewBox="0 0 24 24" width="14" height="14"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
                </div>
                <div class="nav-icon ic-prev" data-button="prev">
                    <svg viewBox="0 0 24 24" width="14" height="14"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></svg>
                </div>

                <div class="center-knob" id="playBtn">
                    <div class="pause-btn-orange"></div>
                </div>
            </div>
        </div>

        <div class="info-card-panel">
            <div class="search-volume-row">
                <div class="buscar-musica" id="statusIndicator">AGORA T...</div>
                <div class="volume-control">
                    <span>Volume</span>
                    <input type="range" min="0" max="100" value="65" style="margin:0;">
                </div>
            </div>

            <div class="track-info">
                <div class="track-title" id="displayTitle">Nenhuma música carregada</div>
                <div class="track-type" id="displayType">Use o botão abaixo para adicionar faixas locais</div>
                <div class="track-meta">
                    <span>Sem álbum</span>
                    <span>00:00</span>
                    <span>00:00</span>
                </div>
            </div>

            <div class="add-music-btn" id="folderBtn">
                Adicionar músicas da pasta
            </div>
            <input type="file" id="audioInput" accept="audio/*" multiple style="display: none;">

            <div class="canvas-container">
                <canvas id="spectrumCanvas"></canvas>
            </div>
        </div>

        <div class="eq-section">
            <div class="eq-title">EQUALIZADOR AVANÇADO</div>
            <div id="eqControls" class="eq-container"></div>
        </div>

        <div class="footer-credits">
            Feito por: Natanael Teixeira
        </div>
    </div>

    <script>
        const playBtn = document.getElementById('playBtn');
        const themeBtn = document.getElementById('themeBtn');
        const spectrumCanvas = document.getElementById('spectrumCanvas');
        const eqControls = document.getElementById('eqControls');
        
        // Elementos de Carga de Arquivos adicionados
        const folderBtn = document.getElementById('folderBtn');
        const audioInput = document.getElementById('audioInput');
        const displayTitle = document.getElementById('displayTitle');
        const displayType = document.getElementById('displayType');
        const statusIndicator = document.getElementById('statusIndicator');

        const equalizerBands = [
            { label: 'GRAVES (120HZ)', gain: 0, min: -12, max: 12 },
            { label: 'MÉDIOS (1000HZ)', gain: 0, min: -12, max: 12 },
            { label: 'AGUDOS (6000HZ)', gain: 0, min: -12, max: 12 }
        ];

        let isPlaying = true, isLightTheme = false;

        // --- LÓGICA DO SELECIONADOR DINÂMICO DE BOTÕES ---
        const navIcons = document.querySelectorAll('.nav-icon');
        navIcons.forEach(icon => {
            icon.addEventListener('click', () => {
                // Remove a linha vermelha ativa de todos os botões
                navIcons.forEach(i => i.classList.remove('active-red'));
                // Adiciona a linha vermelha exclusivamente ao botão clicado
                icon.classList.add('active-red');
            });
        });

        // --- LÓGICA DE ADICIONAR MÚSICAS LOCAIS DA PASTA ---
        folderBtn.addEventListener('click', () => {
            audioInput.click(); // Dispara o clique do seletor oculto de arquivos nativo do sistema
        });

        audioInput.addEventListener('change', (e) => {
            const files = e.target.files;
            if (files.length > 0) {
                const firstTrack = files[0];
                // Remove a extensão do arquivo (.mp3, .wav) para exibir um título limpo
                const cleanName = firstTrack.name.replace(/\.[^/.]+$/, "");
                
                displayTitle.textContent = cleanName;
                displayType.textContent = "Música carregada localmente";
                statusIndicator.textContent = "TOCANDO";
                
                if(!isPlaying) togglePlay(); // Força o play se estiver pausado
            }
        });

        function togglePlay() {
            isPlaying = !isPlaying;
            const pauseIcon = playBtn.querySelector('.pause-btn-orange');
            if (!isPlaying) {
                pauseIcon.style.background = '#bdc3c7';
                pauseIcon.style.boxShadow = 'none';
            } else {
                pauseIcon.style.background = '#f39c12';
                pauseIcon.style.boxShadow = '0 4px 12px rgba(243, 156, 18, 0.3)';
            }
        }

        function buildEqualizer() {
            eqControls.innerHTML = equalizerBands.map((band, idx) => `
                <div class="eq-slider">
                    <div class="eq-meta">
                        <span class="eq-label">${band.label}</span>
                        <span id="eqOut-${idx}" class="eq-value">${band.gain} dB</span>
                    </div>
                    <input type="range" min="${band.min}" max="${band.max}" value="${band.gain}" data-idx="${idx}">
                </div>
            `).join('');

            eqControls.querySelectorAll('input[type=range]').forEach(input => {
                input.addEventListener('input', (e) => {
                    const idx = e.target.dataset.idx;
                    const val = e.target.value;
                    document.getElementById(`eqOut-${idx}`).textContent = `${val} dB`;
                    equalizerBands[idx].gain = parseInt(val);
                });
            });
        }

        playBtn.addEventListener('click', togglePlay);
        
        themeBtn.addEventListener('click', () => {
            isLightTheme = !isLightTheme;
            document.body.classList.toggle('light-theme', isLightTheme);
            themeBtn.textContent = isLightTheme ? 'Tema escuro' : 'Tema claro';
            initCanvasScale();
        });

        function drawSpectrum() {
            const ctx = spectrumCanvas.getContext('2d');
            const dpr = window.devicePixelRatio || 1;
            const w = spectrumCanvas.width / dpr;
            const h = spectrumCanvas.height / dpr;
            
            ctx.clearRect(0, 0, w, h);
            ctx.fillStyle = isLightTheme ? 'rgba(0,0,0,0.03)' : 'rgba(0,0,0,0.2)';
            ctx.fillRect(0, 0, w, h);

            const barsCount = 38;
            const barWidth = w / barsCount;
            for (let i = 0; i < barsCount; i++) {
                const fade = (barsCount - i) / barsCount;
                const barH = isPlaying ? Math.max(5, (Math.sin(i * 0.4) * 12 + 16) * fade) : 4;
                const x = i * barWidth + 1;
                const y = (h - barH) / 2;
                ctx.fillStyle = '#df3850';
                ctx.fillRect(x, y, barWidth - 2, barH);
            }
        }

        function initCanvasScale() {
            const rect = spectrumCanvas.parentElement.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            spectrumCanvas.width = rect.width * dpr;
            spectrumCanvas.height = rect.height * dpr;
            const ctx = spectrumCanvas.getContext('2d');
            ctx.scale(dpr, dpr);
            drawSpectrum();
        }

        buildEqualizer();
        setTimeout(initCanvasScale, 100);
        window.addEventListener('resize', initCanvasScale);
        
        setInterval(() => { if(isPlaying) drawSpectrum(); }, 120);
    </script>
</body>
</html>
