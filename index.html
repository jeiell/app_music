<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#050608">
    <link rel="manifest" href="manifest.json">
    <title>Cyber Audio Glass</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        :root {
            --bg-900: #050608;
            --bg-850: #0c1016;
            --surface: rgba(255, 255, 255, 0.04);
            --surface-strong: rgba(255, 255, 255, 0.12);
            --text-primary: #f8f8f9;
            --text-muted: #a0a8b8;
            --accent: #ff000f;
            --accent-soft: rgba(255, 0, 15, 0.24);
            --accent-strong: #ff2542;
            --shadow: 0 32px 90px rgba(0, 0, 0, 0.36);
            --transition: 0.22s ease;
        }

        body.light {
            --bg-900: #ffffff;
            --bg-850: #ffffff;
            --surface: rgba(0, 0, 0, 0.04);
            --surface-strong: rgba(0, 0, 0, 0.08);
            --text-primary: #111827;
            --text-muted: #6b7280;
            --accent: #d7263d;
            --accent-soft: rgba(215, 38, 61, 0.15);
            --accent-strong: #ff4d5a;
            --shadow: 0 32px 70px rgba(0, 0, 0, 0.12);
        }

        body {
            min-height: 100vh;
            height: 100vh;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            color: var(--text-primary);
            background: radial-gradient(circle at top, rgba(255, 59, 79, 0.12), transparent 18%),
                        linear-gradient(180deg, var(--bg-900), var(--bg-850) 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
            transition: background var(--transition), color var(--transition);
        }

        .app-shell {
            position: relative;
            width: 100%;
            max-width: 960px;
            height: 100%;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            z-index: 1;
            margin: 0 auto;
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 40px;
            flex-shrink: 0;
        }

        .app-title {
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: var(--accent);
            text-shadow: 0 0 24px rgba(255, 59, 79, 0.18);
        }

        .icon-button {
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 59, 79, 0.12);
            color: var(--text-primary);
            border-radius: 12px;
            padding: 0.5rem 1rem;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: background var(--transition), transform var(--transition);
        }

        /* CARD PRINCIPAL COM RESPONSIVIDADE EM ALTURA */
        .card {
            position: relative;
            flex: 1;
            border-radius: 28px;
            background: var(--surface);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            box-shadow: var(--shadow);
            padding: 1.5rem;
            overflow: hidden;
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 2rem;
            align-items: center;
        }

        /* CONTÊINER DO DISCO */
        .menu-section {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .menu-container {
            position: relative;
            width: 100%;
            max-width: 320px;
            aspect-ratio: 1 / 1;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05), 0 24px 50px rgba(0, 0, 0, 0.25);
        }

        .menu-item {
            position: absolute;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            font-size: 1rem;
            border: 1px solid transparent;
            display: grid;
            place-items: center;
            cursor: pointer;
            transition: all var(--transition);
        }

        .menu-item:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .menu-item.active {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 0, 15, 0.4);
        }

        .menu-item.highlighted {
            color: #ff8c00;
            background: rgba(255, 140, 0, 0.15);
            border-color: rgba(255, 140, 0, 0.5);
            text-shadow: 0 0 10px rgba(255, 140, 0, 0.5);
        }

        /* Posicionamento radial preciso */
        .menu-item:nth-child(1) { top: 12px; left: calc(50% - 21px); }
        .menu-item:nth-child(2) { top: 52px; right: 16px; }
        .menu-item:nth-child(3) { bottom: 52px; right: 16px; }
        .menu-item:nth-child(4) { bottom: 12px; left: calc(50% - 21px); }
        .menu-item:nth-child(5) { bottom: 52px; left: 16px; }
        .menu-item:nth-child(6) { top: 52px; left: 16px; }

        .central-dimmer {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #161314;
            border: 2px solid rgba(255, 30, 58, 0.15);
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.8), 0 0 20px rgba(255, 30, 58, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .dimmer-inner {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .center-play-btn {
            width: 50px;
            height: 50px;
            border: none;
            border-radius: 14px;
            background: #ff8c00;
            color: #ffffff;
            cursor: pointer;
            display: grid;
            place-items: center;
            box-shadow: 0 4px 15px rgba(255, 140, 0, 0.4);
            transition: transform var(--transition);
        }

        .center-play-btn .play-icon {
            display: block;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 8px 0 8px 14px;
            border-color: transparent transparent transparent #ffffff;
            transform: translateX(2px);
        }

        .center-play-btn.playing .play-icon {
            border: none;
            width: 14px;
            height: 16px;
            background: #ffffff;
            box-shadow: -6px 0 0 #ffffff, 6px 0 0 #ffffff;
            transform: scaleX(0.4);
        }

        .led-indicator {
            position: absolute;
            top: 10px;
            left: calc(50% - 2px);
            width: 4px;
            height: 14px;
            border-radius: 999px;
            background: linear-gradient(180deg, #ff5d6d 0%, #ff0018 100%);
            box-shadow: 0 0 12px rgba(255, 0, 15, 0.8);
            transform-origin: center 50px;
            transition: transform 0.15s ease;
        }

        /* PAINEL DE INFORMAÇÕES */
        .display-panel {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 0.8rem;
        }

        .panel-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        .panel-title {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent);
        }

        .volume-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex: 1;
            max-width: 180px;
        }

        .volume-group label {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .volume-range {
            width: 100%;
            appearance: none;
            -webkit-appearance: none;
            height: 5px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.1);
            outline: none;
        }

        .volume-range::-webkit-slider-runnable-track {
            height: 5px;
            background: linear-gradient(to right, var(--accent) var(--seek-before-width, 75%), rgba(255,255,255,0.1) var(--seek-before-width, 75%));
            border-radius: 999px;
        }

        .volume-range::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 12px;
            width: 12px;
            border-radius: 50%;
            background: #0076ff;
            margin-top: -3.5px;
            box-shadow: 0 0 8px rgba(0, 118, 255, 0.6);
        }

        .track-meta {
            display: grid;
            gap: 0.2rem;
        }

        .track-info {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .artist-info {
            font-size: 0.9rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .meta-row {
            display: flex;
            gap: 0.6rem;
            color: var(--text-muted);
            font-size: 0.8rem;
            align-items: center;
        }

        .meta-row span:not(:first-child)::before {
            content: '•';
            color: var(--accent);
            margin-right: 0.6rem;
        }

        .file-button {
            width: 100%;
            padding: 0.75rem;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(0, 0, 0, 0.2);
            color: var(--text-primary);
            font-size: 0.9rem;
            font-weight: 600;
            text-align: center;
            display: block;
            cursor: pointer;
            transition: all var(--transition);
        }

        .file-button:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 59, 79, 0.3);
        }

        .spectrum-canvas {
            width: 100%;
            height: 50px;
            border-radius: 12px;
            background: rgba(10, 6, 8, 0.4);
            border: 1px solid rgba(255, 0, 15, 0.08);
            display: block;
        }

        /* EQUALIZADOR INTEGRADO SEM TRANSBORDAR */
        .equalizer-panel {
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 0.6rem;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .equalizer-header {
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .equalizer-controls {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .eq-slider {
            display: flex;
            flex-direction: column;
            gap: 0.15rem;
        }

        .eq-slider .eq-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
        }

        .eq-slider span {
            font-weight: 600;
            text-transform: uppercase;
        }

        .eq-slider output {
            color: var(--text-muted);
        }

        .eq-slider input[type=range] {
            width: 100%;
            appearance: none;
            -webkit-appearance: none;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
        }

        .eq-slider input[type=range]::-webkit-slider-runnable-track {
            height: 4px;
            background: linear-gradient(to right, var(--accent) 50%, rgba(255,255,255,0.1) 50%);
            border-radius: 2px;
        }

        .eq-slider input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 12px;
            width: 12px;
            border-radius: 50%;
            background: var(--accent);
            margin-top: -4px;
            box-shadow: 0 0 6px var(--accent-soft);
        }

        /* INTERFACE ADAPTÁVEL MOBILE (FLUIDEZ VERTICAL) */
        @media (max-width: 768px) {
            body {
                overflow: hidden;
            }

            .card {
                grid-template-columns: 1fr;
                gap: 1rem;
                padding: 1rem;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                overflow: hidden;
            }

            .menu-section {
                flex: 1.1;
                min-height: 180px;
            }

            .menu-container {
                max-width: 240px;
            }

            .menu-item {
                width: 36px;
                height: 36px;
                font-size: 0.85rem;
            }

            .menu-item:nth-child(1) { left: calc(50% - 18px); top: 8px; }
            .menu-item:nth-child(2) { top: 42px; right: 10px; }
            .menu-item:nth-child(3) { bottom: 42px; right: 10px; }
            .menu-item:nth-child(4) { bottom: 8px; left: calc(50% - 18px); }
            .menu-item:nth-child(5) { bottom: 42px; left: 10px; }
            .menu-item:nth-child(6) { top: 42px; left: 10px; }

            .central-dimmer { width: 100px; height: 100px; }
            .center-play-btn { width: 42px; height: 42px; border-radius: 10px; }
            .led-indicator { transform-origin: center 40px; top: 10px; height: 12px; }

            .display-panel {
                flex: 1.2;
                justify-content: space-between;
                gap: 0.5rem;
            }

            .track-info { font-size: 1.1rem; }
            .artist-info { font-size: 0.85rem; }
            .file-button { padding: 0.6rem; font-size: 0.85rem; }
            .spectrum-canvas { height: 40px; }
        }

        /* PROTEÇÃO EXTRA PARA TELAS MUITO CURTAS */
        @media (max-height: 660px) and (max-width: 768px) {
            .menu-section { min-height: 140px; }
            .menu-container { max-width: 190px; }
            .menu-item { width: 30px; height: 30px; font-size: 0.75rem; }
            .menu-item:nth-child(1) { left: calc(50% - 15px); top: 4px; }
            .menu-item:nth-child(2) { top: 32px; right: 6px; }
            .menu-item:nth-child(3) { bottom: 32px; right: 6px; }
            .menu-item:nth-child(4) { bottom: 4px; left: calc(50% - 15px); }
            .menu-item:nth-child(5) { bottom: 32px; left: 6px; }
            .menu-item:nth-child(6) { top: 32px; left: 6px; }
            .central-dimmer { width: 80px; height: 80px; }
            .center-play-btn { width: 34px; height: 34px; }
            .led-indicator { transform-origin: center 30px; top: 10px; height: 10px; }
            .track-info { font-size: 1rem; }
            .spectrum-canvas { height: 30px; }
        }
    </style>
</head>
<body>
    <main class="app-shell">
        <div class="app-header">
            <div class="app-title">CYBER AUDIO PRO</div>
            <button id="themeBtn" class="icon-button" type="button">Tema claro</button>
        </div>
        <section class="card">
            <div class="menu-section">
                <div class="menu-container">
                    <button class="menu-item active" data-action="home" title="Playlist">♫</button>
                    <button class="menu-item" data-action="search" title="Buscar">🔎</button>
                    <button class="menu-item" data-action="next" title="Próxima faixa">⏭</button>
                    <button class="menu-item" data-action="repeat" title="Repetir">🔁</button>
                    <button class="menu-item" data-action="shuffle" title="Aleatório">🔀</button>
                    <button class="menu-item" data-action="back" title="Voltar faixa">⏮</button>
                    <div class="central-dimmer" id="dimmer">
                        <div class="dimmer-inner">
                            <div class="led-indicator" id="led"></div>
                            <button class="center-play-btn" id="playBtn" type="button"><span class="play-icon"></span></button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="display-panel" id="panel">
                <div class="panel-row">
                    <div class="panel-title" id="panelTitle">Agora tocando</div>
                    <div class="volume-group">
                        <label for="volumeRange">Volume</label>
                        <input id="volumeRange" class="volume-range" type="range" min="0" max="100" value="75">
                    </div>
                </div>
                <div class="track-meta">
                    <div class="track-info" id="trackName">Nenhuma música carregada</div>
                    <div class="artist-info" id="artistName">Use o botão abaixo para adicionar faixas</div>
                </div>
                <div class="meta-row">
                    <span id="trackAlbum">Sem álbum</span>
                    <span id="trackTime">00:00</span>
                    <span id="trackDuration">00:00</span>
                </div>
                <div>
                    <label for="trackFiles" class="file-button">Adicionar músicas da pasta</label>
                    <input id="trackFiles" type="file" accept="audio/*" multiple hidden>
                </div>
                <canvas id="spectrumCanvas" class="spectrum-canvas"></canvas>
                
                <!-- Painel Equalizador Unificado -->
                <div class="equalizer-panel">
                    <div class="equalizer-header">Equalizador Avançado</div>
                    <div class="equalizer-controls" id="eqControls"></div>
                </div>
            </div>
        </section>
    </main>
    <script>
        const playlist = [];
        const menuButtons = document.querySelectorAll('.menu-item');
        const playBtn = document.getElementById('playBtn');
        const themeBtn = document.getElementById('themeBtn');
        const led = document.getElementById('led');
        const panelTitle = document.getElementById('panelTitle');
        const trackName = document.getElementById('trackName');
        const artistName = document.getElementById('artistName');
        const trackAlbum = document.getElementById('trackAlbum');
        const trackTime = document.getElementById('trackTime');
        const trackDuration = document.getElementById('trackDuration');
        const trackFiles = document.getElementById('trackFiles');
        const volumeRange = document.getElementById('volumeRange');
        const spectrumCanvas = document.getElementById('spectrumCanvas');
        const eqControls = document.getElementById('eqControls');

        const equalizerBands = [
            { label: 'Graves', type: 'lowshelf', freq: 120, gain: 0, min: -12, max: 12 },
            { label: 'Médios', type: 'peaking', freq: 1000, gain: 0, Q: 1, min: -12, max: 12 },
            { label: 'Agudos', type: 'highshelf', freq: 6000, gain: 0, min: -12, max: 12 }
        ];
        let lowShelfFilter, midPeakingFilter, highShelfFilter;

        const audio = new Audio();
        audio.crossOrigin = 'anonymous';
        audio.volume = 0.75;

        let audioContext, analyser, sourceNode, dataArray, animationId;
        let currentTrackIndex = -1, isPlaying = false, isShuffle = false, isRepeat = false, isLightTheme = false, currentLedAngle = 0;

        function initAudioGraph() {
            if (audioContext) return;
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            sourceNode = audioContext.createMediaElementSource(audio);

            lowShelfFilter = audioContext.createBiquadFilter();
            lowShelfFilter.type = 'lowshelf';
            lowShelfFilter.frequency.value = equalizerBands[0].freq;
            lowShelfFilter.gain.value = equalizerBands[0].gain;

            midPeakingFilter = audioContext.createBiquadFilter();
            midPeakingFilter.type = 'peaking';
            midPeakingFilter.frequency.value = equalizerBands[1].freq;
            midPeakingFilter.Q.value = equalizerBands[1].Q;
            midPeakingFilter.gain.value = equalizerBands[1].gain;

            highShelfFilter = audioContext.createBiquadFilter();
            highShelfFilter.type = 'highshelf';
            highShelfFilter.frequency.value = equalizerBands[2].freq;
            highShelfFilter.gain.value = equalizerBands[2].gain;

            sourceNode.connect(lowShelfFilter);
            lowShelfFilter.connect(midPeakingFilter);
            midPeakingFilter.connect(highShelfFilter);

            analyser = audioContext.createAnalyser();
            analyser.fftSize = 512;
            highShelfFilter.connect(analyser);
            analyser.connect(audioContext.destination);
            dataArray = new Uint8Array(analyser.frequencyBinCount);
            drawSpectrum();
        }

        function setActiveButton(action) {
            menuButtons.forEach(button => button.classList.toggle('active', button.dataset.action === action));
        }

        function setLedDirection(action) {
            const ledDirections = { home: 0, search: 90, next: 135, repeat: 180, shuffle: 225, back: -90 };
            currentLedAngle = ledDirections[action] ?? currentLedAngle;
        }

        function selectTrack(index, playImmediately = false) {
            if (!playlist[index]) return;
            currentTrackIndex = index;
            const track = playlist[index];
            trackName.textContent = track.title;
            artistName.textContent = track.artist;
            trackAlbum.textContent = track.album || 'Arquivo local';
            trackTime.textContent = '00:00';
            trackDuration.textContent = track.duration || '00:00';
            panelTitle.textContent = "Tocando";
            setActiveButton('home');
            setLedDirection('home');

            if (track.url) {
                audio.src = track.url;
                audio.load();
                if (playImmediately) {
                    resumeAudioContext().then(() => audio.play().catch(() => {}));
                    isPlaying = true;
                    playBtn.classList.add('playing');
                }
            }
        }

        function formatTime(seconds) {
            if (isNaN(seconds)) return "00:00";
            const minutes = Math.floor(seconds / 60);
            const rest = String(Math.floor(seconds % 60)).padStart(2, '0');
            return `${minutes}:${rest}`;
        }

        function updatePlaybackTime() {
            trackTime.textContent = formatTime(audio.currentTime);
            if (audio.duration) trackDuration.textContent = formatTime(audio.duration);
        }

        async function resumeAudioContext() {
            if (!audioContext) initAudioGraph();
            if (audioContext && audioContext.state === 'suspended') await audioContext.resume();
        }

        function togglePlay() {
            if (currentTrackIndex < 0 && playlist.length) {
                selectTrack(0, true);
                return;
            }
            if (currentTrackIndex < 0) return;
            resumeAudioContext();
            isPlaying = !isPlaying;
            if (isPlaying) {
                audio.play().catch(() => {});
                playBtn.classList.add('playing');
            } else {
                audio.pause();
                playBtn.classList.remove('playing');
            }
        }

        function changeTrack(direction) {
            if (!playlist.length) return;
            if (isShuffle) {
                currentTrackIndex = Math.floor(Math.random() * playlist.length);
            } else {
                currentTrackIndex += direction;
                if (currentTrackIndex >= playlist.length) currentTrackIndex = 0;
                if (currentTrackIndex < 0) currentTrackIndex = playlist.length - 1;
            }
            selectTrack(currentTrackIndex, isPlaying);
        }

        function drawSpectrum() {
            if (!analyser) return;
            analyser.getByteFrequencyData(dataArray);
            const ctx = spectrumCanvas.getContext('2d');
            const width = spectrumCanvas.width = spectrumCanvas.clientWidth;
            const height = spectrumCanvas.height = spectrumCanvas.clientHeight;
            ctx.clearRect(0, 0, width, height);

            const barCount = 32;
            const barWidth = width / barCount;
            const center = height / 2;

            for (let i = 0; i < barCount; i++) {
                const value = dataArray[Math.floor(i * dataArray.length / barCount)];
                const barHeight = (value / 255) * (height * 0.45);
                const x = i * barWidth;
                
                const gradient = ctx.createLinearGradient(0, center - barHeight, 0, center + barHeight);
                gradient.addColorStop(0, 'rgba(255, 90, 110, 0.95)');
                gradient.addColorStop(0.5, 'rgba(255, 10, 30, 0.95)');
                gradient.addColorStop(1, 'rgba(255, 0, 15, 0.2)');
                
                ctx.fillStyle = gradient;
                ctx.fillRect(x + 1, center - barHeight, barWidth - 2, barHeight * 2);
            }

            const energy = Math.max(...dataArray) / 255;
            led.style.opacity = energy > 0.1 ? '1' : '0.5';
            led.style.transform = `rotate(${currentLedAngle + (energy * 10)}deg)`;

            animationId = requestAnimationFrame(drawSpectrum);
        }

        function buildEqualizer() {
            eqControls.innerHTML = equalizerBands.map((band, idx) => `
                <div class="eq-slider">
                    <div class="eq-meta">
                        <span>${band.label} (${band.freq}Hz)</span>
                        <output id="eqOut-${idx}">0 dB</output>
                    </div>
                    <input type="range" min="${band.min}" max="${band.max}" value="${band.gain}" data-idx="${idx}">
                </div>
            `).join('');

            eqControls.querySelectorAll('input[type=range]').forEach(input => {
                input.addEventListener('input', (e) => {
                    const idx = e.target.dataset.idx;
                    const val = parseFloat(e.target.value);
                    equalizerBands[idx].gain = val;
                    document.getElementById(`eqOut-${idx}`).textContent = `${val} dB`;
                    
                    if (idx == 0 && lowShelfFilter) lowShelfFilter.gain.value = val;
                    if (idx == 1 && midPeakingFilter) midPeakingFilter.gain.value = val;
                    if (idx == 2 && highShelfFilter) highShelfFilter.gain.value = val;
                });
            });
        }

        trackFiles.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            files.forEach(file => {
                let title = file.name.replace(/\.[^/.]+$/, "");
                let artist = "Arquivo Local";
                if (title.includes('-')) {
                    const parts = title.split('-');
                    artist = parts[0].trim();
                    title = parts[1].trim();
                }
                playlist.push({ title, artist, album: "Pasta Local", url: URL.createObjectURL(file) });
            });
            if (currentTrackIndex < 0 && playlist.length) selectTrack(0, false);
        });

        playBtn.addEventListener('click', togglePlay);
        themeBtn.addEventListener('click', () => {
            isLightTheme = !isLightTheme;
            document.body.classList.toggle('light', isLightTheme);
            themeBtn.textContent = isLightTheme ? 'Tema escuro' : 'Tema claro';
        });

        menuButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                const action = btn.dataset.action;
                setLedDirection(action);
                if (action === 'next') changeTrack(1);
                else if (action === 'back') changeTrack(-1);
                else if (action === 'shuffle') { isShuffle = !isShuffle; btn.classList.toggle('highlighted', isShuffle); }
                else if (action === 'repeat') { isRepeat = !isRepeat; btn.classList.toggle('highlighted', isRepeat); }
                else setActiveButton(action);
            });
        });

        volumeRange.addEventListener('input', (e) => {
            const val = e.target.value;
            audio.volume = val / 100;
            e.target.style.setProperty('--seek-before-width', val + '%');
        });

        audio.addEventListener('timeupdate', updatePlaybackTime);
        audio.addEventListener('ended', () => isRepeat ? (audio.currentTime = 0, audio.play()) : changeTrack(1));

        // Start
        buildEqualizer();
    </script>
</body>
</html>
