<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#050608">
    <title>Cyber Audio Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        /* Resets Básicos */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        :root {
            --bg-gradient: linear-gradient(180deg, #160608 0%, #050203 100%);
            --surface: rgba(35, 30, 31, 0.95);
            --surface-border: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-muted: #a0a0a0;
            --accent: #ff1e3a;
            --accent-glow: rgba(255, 30, 58, 0.25);
            --transition: 0.2s ease;
        }

        body.light {
            --bg-gradient: linear-gradient(180deg, #f3f4f6 0%, #e5e7eb 100%);
            --surface: rgba(255, 255, 255, 0.95);
            --surface-border: rgba(0, 0, 0, 0.08);
            --text-primary: #111827;
            --text-muted: #6b7280;
            --accent: #d7263d;
            --accent-glow: rgba(215, 38, 61, 0.15);
        }

        html,
        body {
            min-height: 100vh;
            height: 100%;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: var(--text-primary);
            background: var(--bg-gradient);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background var(--transition), color var(--transition);
            position: fixed;
            inset: 0;
            overflow: hidden;
            padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
            min-height: 100dvh;
        }

        .app-shell {
            width: 100%;
            max-width: 450px;
            max-height: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-height: 0;
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            height: clamp(38px, 7vw, 46px);
            flex-shrink: 0;
            padding: 0 10px;
        }

        .app-title {
            flex: 1;
            min-width: 0;
            font-size: clamp(0.75rem, 2.1vw, 1rem);
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--accent);
            text-shadow: 0 0 15px var(--accent-glow);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .theme-btn {
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            border-radius: 10px;
            padding: clamp(6px, 1.5vw, 9px) clamp(10px, 2.5vw, 14px);
            cursor: pointer;
            font-size: clamp(0.7rem, 1.4vw, 0.85rem);
            font-weight: 600;
            backdrop-filter: blur(6px);
            white-space: nowrap;
            flex-shrink: 0;
            transition: var(--transition);
            max-width: 135px;
        }

        .theme-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .card {
            flex: 1;
            min-height: 0;
            border-radius: clamp(18px, 4vw, 30px);
            background: var(--surface);
            border: 1px solid var(--surface-border);
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.05), 0 18px 40px rgba(0, 0, 0, 0.45);
            padding: clamp(12px, 3vw, 18px);
            display: flex;
            flex-direction: column;
            gap: clamp(8px, 2vw, 12px);
            overflow: hidden;
        }

        .menu-section {
            flex: 0 0 auto;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .menu-container {
            position: relative;
            width: min(210px, 46vw);
            height: min(210px, 46vw);
            max-width: 210px;
            max-height: 210px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0) 100%), rgba(255, 255, 255, 0.01);
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.32), inset 0 2px 5px rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .menu-item {
            position: absolute;
            width: clamp(28px, 8vw, 36px);
            height: clamp(28px, 8vw, 36px);
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: var(--text-muted);
            font-size: clamp(0.7rem, 1.9vw, 0.9rem);
            display: grid;
            place-items: center;
            cursor: pointer;
            transition: all var(--transition);
        }

        .menu-item.highlighted {
            color: #ffffff;
            background: #ff8c00;
            border-color: #ffaa33;
            box-shadow: 0 0 12px rgba(255, 140, 0, 0.4);
        }

        .menu-item:nth-child(1) {
            top: 6%;
            left: 50%;
            transform: translateX(-50%);
        }

        .menu-item:nth-child(2) {
            top: 25%;
            right: 5%;
        }

        .menu-item:nth-child(3) {
            bottom: 25%;
            right: 5%;
        }

        .menu-item:nth-child(4) {
            bottom: 6%;
            left: 50%;
            transform: translateX(-50%);
        }

        .menu-item:nth-child(5) {
            bottom: 25%;
            left: 5%;
        }

        .menu-item:nth-child(6) {
            top: 25%;
            left: 5%;
        }

        .central-dimmer {
            width: min(92px, 24vw);
            height: min(92px, 24vw);
            max-width: 92px;
            max-height: 92px;
            border-radius: 50%;
            background: #141112;
            border: 2px solid rgba(255, 30, 58, 0.12);
            box-shadow: inset 0 3px 8px rgba(0, 0, 0, 0.8), 0 0 15px var(--accent-glow);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .center-play-btn {
            width: clamp(34px, 9vw, 44px);
            height: clamp(34px, 9vw, 44px);
            border: none;
            border-radius: 10px;
            background: #ff8c00;
            color: #ffffff;
            cursor: pointer;
            display: grid;
            place-items: center;
            box-shadow: 0 4px 12px rgba(255, 140, 0, 0.4);
            transition: var(--transition);
        }

        .center-play-btn:hover {
            background: #ffaa33;
        }

        .center-play-btn .play-icon {
            display: block;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 6px 0 6px 11px;
            border-color: transparent transparent transparent #ffffff;
            transform: translateX(1px);
        }

        .center-play-btn.playing .play-icon {
            border: none;
            width: 11px;
            height: 12px;
            background: #ffffff;
            box-shadow: -4px 0 0 #ffffff, 4px 0 0 #ffffff;
            transform: scaleX(0.5);
        }

        .display-panel {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 10px;
        }

        .panel-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .panel-title {
            font-size: clamp(0.7rem, 1.5vw, 0.8rem);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--accent);
        }

        .volume-group {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1;
            max-width: 100%;
            min-width: 0;
        }

        .volume-group label {
            font-size: clamp(0.65rem, 1.2vw, 0.75rem);
            color: var(--text-muted);
            white-space: nowrap;
            flex-shrink: 0;
        }

        .volume-range {
            width: 100%;
            appearance: none;
            -webkit-appearance: none;
            height: 4px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.08);
            outline: none;
        }

        .volume-range::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 12px;
            width: 12px;
            border-radius: 50%;
            background: #0076ff;
            margin-top: -4px;
            box-shadow: 0 0 6px rgba(0, 118, 255, 0.5);
        }

        .volume-range::-moz-range-thumb {
            height: 12px;
            width: 12px;
            border-radius: 50%;
            background: #0076ff;
            box-shadow: 0 0 6px rgba(0, 118, 255, 0.5);
            border: none;
        }

        .track-meta {
            display: grid;
            gap: 4px;
            min-height: 0;
        }

        .track-info,
        .artist-info {
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-info {
            font-size: clamp(0.9rem, 2.2vw, 1rem);
            font-weight: 700;
            color: var(--text-primary);
        }

        .artist-info {
            font-size: clamp(0.7rem, 1.4vw, 0.82rem);
            color: var(--text-muted);
        }

        .meta-row {
            display: flex;
            gap: 6px;
            color: var(--text-muted);
            font-size: clamp(0.6rem, 1vw, 0.75rem);
            align-items: center;
            flex-wrap: wrap;
            min-height: 0;
        }

        .meta-row span:not(:first-child)::before {
            content: '•';
            color: var(--accent);
            margin-right: 6px;
        }

        .file-button {
            width: 100%;
            padding: clamp(8px, 2vw, 10px);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-primary);
            font-size: clamp(0.75rem, 1.4vw, 0.85rem);
            font-weight: 600;
            text-align: center;
            display: block;
            cursor: pointer;
            transition: var(--transition);
            flex-shrink: 0;
        }

        .file-button:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .spectrum-canvas {
            width: 100%;
            height: clamp(24px, 4vw, 36px);
            border-radius: 10px;
            background: rgba(10, 5, 6, 0.45);
            border: 1px solid rgba(255, 0, 15, 0.08);
            display: block;
            flex-shrink: 0;
        }

        .equalizer-panel {
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding: 8px 0 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-shrink: 0;
        }

        .equalizer-header {
            font-size: clamp(0.6rem, 1.2vw, 0.72rem);
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            user-select: none;
            flex-shrink: 0;
        }

        .equalizer-controls {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 8px;
            flex-wrap: wrap;
            padding: 2px 0;
        }

        .eq-knob-group {
            width: clamp(70px, 22%, 90px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .eq-knob-label {
            font-size: clamp(0.48rem, 0.9vw, 0.55rem);
            font-weight: 600;
            color: var(--text-muted);
            text-align: center;
            white-space: nowrap;
            line-height: 1;
        }

        .eq-knob-value {
            font-size: clamp(0.45rem, 0.85vw, 0.52rem);
            color: var(--accent);
            font-weight: 700;
            line-height: 1;
        }

        .eq-knob {
            position: relative;
            width: clamp(36px, 10vw, 48px);
            height: clamp(36px, 10vw, 48px);
            border-radius: 50%;
            background: conic-gradient(
                from 180deg,
                rgba(255, 30, 58, 0.4) 0deg,
                rgba(255, 30, 58, 0.1) 180deg,
                rgba(255, 255, 255, 0.05) 180deg
            );
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.4), 0 2px 6px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: box-shadow 0.15s ease;
            --knob-rotation: -180deg;
        }

        .eq-knob:hover {
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.4), 0 2px 8px rgba(255, 30, 58, 0.2);
        }

        .eq-knob::before {
            content: '';
            position: absolute;
            width: 2px;
            height: 35%;
            background: linear-gradient(to top, var(--accent), rgba(255, 30, 58, 0.6));
            border-radius: 1px;
            top: 10%;
            transform: rotateZ(var(--knob-rotation));
            transform-origin: center 90%;
            box-shadow: 0 0 3px var(--accent-glow);
            transition: transform 0.1s ease;
        }

        .eq-knob input[type=range] {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            border-radius: 50%;
            z-index: 2;
            margin: 0;
        }

        @media (max-width: 420px) {
            .app-header { padding: 0 8px; }
            .app-title { font-size: 0.84rem; }
            .theme-btn { padding: 6px 10px; font-size: 0.72rem; }
            .card { padding: 10px; gap: 10px; }
            .menu-container { width: min(170px, 48vw); height: min(170px, 48vw); }
            .panel-row { flex-direction: column; align-items: flex-start; }
            .volume-group { width: 100%; }
            .equalizer-controls { gap: 6px; }
            .eq-knob-group { width: 45%; }
        }

        @media (max-height: 660px) {
            .app-shell { gap: 4px; }
            .card { padding: 10px; gap: 8px; }
            .equalizer-panel { max-height: 22vh; }
            .equalizer-controls { max-height: calc(22vh - 12px); }
        }

        @supports (padding: max(0px)) {
            body {
                padding-top: max(8px, env(safe-area-inset-top));
                padding-left: max(8px, env(safe-area-inset-left));
                padding-right: max(8px, env(safe-area-inset-right));
                padding-bottom: max(8px, env(safe-area-inset-bottom));
            }
        }
    </style></head>
<body>

    <div class="app-shell">
        <header class="app-header">
            <div class="app-title">Cyber Audio Pro</div>
            <button id="themeBtn" class="theme-btn" type="button">Tema claro</button>
        </header>

        <main class="card">
            <section class="menu-section">
                <div class="menu-container">
                    <button class="menu-item" data-action="playlist" title="Playlist">🎵</button>
                    <button class="menu-item" data-action="search" title="Buscar">🔍</button>
                    <button class="menu-item" data-action="next" title="Próxima">⏭</button>
                    <button class="menu-item highlighted" data-action="repeat" title="Repetir">🔁</button>
                    <button class="menu-item highlighted" data-action="shuffle" title="Aleatório">🔀</button>
                    <button class="menu-item" data-action="back" title="Voltar">⏮</button>
                    <div class="central-dimmer">
                        <button class="center-play-btn" id="playBtn" type="button"><span class="play-icon"></span></button>
                    </div>
                </div>
            </section>

            <div class="display-panel">
                <div class="panel-row">
                    <div class="panel-title">Agora tocando</div>
                    <div class="volume-group">
                        <label for="volumeRange">Vol</label>
                        <input id="volumeRange" class="volume-range" type="range" min="0" max="100" value="75">
                    </div>
                </div>

                <div class="track-meta">
                    <div class="track-info" id="trackName">Nenhuma música carregada</div>
                    <div class="artist-info" id="artistName">Adicione faixas de som no botão abaixo</div>
                </div>

                <div class="meta-row">
                    <span>Sem álbum</span>
                    <span>00:00</span>
                    <span>00:00</span>
                </div>

                <div>
                    <label for="trackFiles" class="file-button">Adicionar músicas</label>
                    <input id="trackFiles" type="file" accept="audio/*" multiple hidden>
                </div>

                <canvas id="spectrumCanvas" class="spectrum-canvas"></canvas>
                
                <div class="equalizer-panel">
                    <div class="equalizer-header">Equalizador</div>
                    <div class="equalizer-controls" id="eqControls"></div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const playlist = [];
        const playBtn = document.getElementById('playBtn');
        const themeBtn = document.getElementById('themeBtn');
        const trackName = document.getElementById('trackName');
        const artistName = document.getElementById('artistName');
        const trackFiles = document.getElementById('trackFiles');
        const volumeRange = document.getElementById('volumeRange');
        const spectrumCanvas = document.getElementById('spectrumCanvas');
        const eqControls = document.getElementById('eqControls');

        const equalizerBands = [
            { label: 'Graves', gain: 0, min: -12, max: 12 },
            { label: 'Médios', gain: 0, min: -12, max: 12 },
            { label: 'Agudos', gain: 0, min: -12, max: 12 },
            { label: 'Sub', gain: 0, min: -12, max: 12 }
        ];

        let isPlaying = false, isLightTheme = false;

        function togglePlay() {
            isPlaying = !isPlaying;
            playBtn.classList.toggle('playing', isPlaying);
        }

        function buildEqualizer() {
            eqControls.innerHTML = equalizerBands.map((band, idx) => `
                <div class="eq-knob-group">
                    <div class="eq-knob-label">${band.label}</div>
                    <div class="eq-knob" id="knob-${idx}">
                        <input type="range" min="${band.min}" max="${band.max}" value="${band.gain}" data-idx="${idx}">
                    </div>
                    <div class="eq-knob-value" id="eqOut-${idx}">0dB</div>
                </div>
            `).join('');

            eqControls.querySelectorAll('input[type=range]').forEach((input, idx) => {
                const knob = input.parentElement;
                
                input.addEventListener('input', (e) => {
                    const val = parseInt(e.target.value);
                    const bandIdx = e.target.dataset.idx;
                    
                    // Rotaciona o knob: -180deg (mínimo) a +180deg (máximo), passando por 0 no meio
                    const range = parseInt(e.target.max) - parseInt(e.target.min);
                    const percentage = (val - parseInt(e.target.min)) / range;
                    const rotation = (percentage * 360) - 180;
                    
                    knob.style.setProperty('--knob-rotation', `${rotation}deg`);
                    document.getElementById(`eqOut-${bandIdx}`).textContent = `${val > 0 ? '+' : ''}${val}dB`;
                });

                // Suporte para mouse drag no desktop
                let isDragging = false;
                input.addEventListener('mousedown', () => { isDragging = true; });
                document.addEventListener('mouseup', () => { isDragging = false; });

                // Suporte para toque no mobile
                input.addEventListener('touchstart', () => { isDragging = true; });
                input.addEventListener('touchend', () => { isDragging = false; });

                // Inicializa rotação
                input.dispatchEvent(new Event('input'));
            });
        }

        playBtn.addEventListener('click', togglePlay);
        themeBtn.addEventListener('click', () => {
            isLightTheme = !isLightTheme;
            document.body.classList.toggle('light', isLightTheme);
            themeBtn.textContent = isLightTheme ? 'Tema escuro' : 'Tema claro';
        });

        function drawEmptySpectrum() {
            const ctx = spectrumCanvas.getContext('2d');
            ctx.clearRect(0, 0, spectrumCanvas.width, spectrumCanvas.height);
            ctx.fillStyle = 'rgba(255, 30, 58, 0.05)';
            ctx.fillRect(0, 0, spectrumCanvas.width, spectrumCanvas.height);
        }

        buildEqualizer();
        drawEmptySpectrum();

        // Inicializa valores dos knobs
        document.addEventListener('DOMContentLoaded', () => {
            buildEqualizer();
        });
    </script>
</body>
</html>
